[package]
name = "dexpdfcraft"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "PdfCraft's desktop interface on Android (Samsung DeX, desktop windowing): the native library the Android app loads"

[lib]
name = "dexpdfcraft"
# cdylib: the library NativeActivity loads; lib: the desktop binary and the tests
crate-type = ["cdylib", "lib"]

[[bin]]
# The same interface in a desktop window, to iterate without a device.
name = "dexpdfcraft-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[lints]
workspace = true

[features]
desktop = ["eframe/x11", "eframe/wayland"]

[dependencies]
pdfcraft-render = { path = "../../upstream/crates/render" }
pdfcraft-engine = { path = "../../upstream/crates/engine" }
egui = { version = "0.37", features = ["default_fonts"] }
# wgpu draws; OpenGL ES (glow) is the fallback, as on the desktop app.
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "glow", "accesskit"] }
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
# The NativeActivity glue (android-activity) comes through winit.
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
eframe = { version = "0.37", default-features = false, features = ["android-native-activity"] }
android_logger = { version = "0.15", default-features = false }
