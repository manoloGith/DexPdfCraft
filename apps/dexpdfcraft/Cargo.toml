[package]
name = "dexpdfcraft"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "PdfCraft's desktop interface on Android (Samsung DeX, desktop windowing): the native library the Android app loads"

[lib]
name = "dexpdfcraft"
# cdylib: the library the Android activity loads; lib: the desktop binary and the tests
crate-type = ["cdylib", "lib"]

[[bin]]
# The same interface in a desktop window, to iterate without a device.
name = "dexpdfcraft-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[lints]
workspace = true

[features]
desktop = ["eframe/x11", "eframe/wayland"]
# Start the phase 1 diagnostics window (input, density, renderer) instead of PdfCraft.
probe = []

[dependencies]
pdfcraft-render = { path = "../../upstream/crates/render" }
pdfcraft-engine = { path = "../../upstream/crates/engine" }
# PdfCraft's desktop interface, from the fork's `dexpdfcraft/android` branch (rfd and arboard shims).
pdfcraft-ui-egui = { path = "../../upstream/crates/ui-egui" }
egui = { version = "0.37", features = ["default_fonts"] }
# wgpu draws; OpenGL ES (glow) is the fallback, as on the desktop app.
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "glow", "accesskit", "persistence"] }
log = "0.4"
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
# The GameActivity glue (android-activity) comes through winit. GameActivity, not NativeActivity:
# it has IME support (GameTextInput), and eframe's `accesskit`, which pdfcraft-ui-egui turns on,
# is only available with it. The Java half is androidx.games:games-activity (android/app).
winit = { version = "0.30", default-features = false, features = ["android-game-activity"] }
eframe = { version = "0.37", default-features = false, features = ["android-game-activity"] }
android_logger = { version = "0.15", default-features = false }
# JNI to MainActivity (pickers, clipboard, "Open with"); the release android-activity uses, so
# its JavaVM singleton is the one this crate sees.
jni = "0.22.4"
# The fork's shims under PdfCraft's names: this crate installs their Android backends.
rfd = { package = "rfd-android-shim", path = "../../upstream/android/rfd-shim" }
arboard = { package = "arboard-android-shim", path = "../../upstream/android/arboard-shim" }
