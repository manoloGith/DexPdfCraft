# DexPdfCraft: PdfCraft's desktop interface on Android, for Samsung DeX and Android desktop windowing.
#
# The PdfCraft engine and its egui interface come unmodified from `upstream/` (a git submodule of
# storytold/pdfcraft, pinned to one commit). This workspace only adds the Android frontend,
# on top of the shared Android layer in `craft-android/` (a git submodule of manoloGith/craft-android).
#
# Path dependencies into `upstream/` resolve their `workspace = true` keys against upstream's own
# workspace, but `[patch]` only applies from the root of the build, so the patches below mirror
# upstream's `Cargo.toml` (keep them in step when the submodule moves: `scripts/sync-upstream.sh`).
[workspace]
resolver = "3"
members = ["apps/dexpdfcraft"]
exclude = ["upstream", "craft-android"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/manoloGith/DexPdfCraft"

[workspace.lints.rust]
# `android_main` must be `#[unsafe(no_mangle)]`; everything else stays free of unsafe code.
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1

# Phase 7: dependencies are optimized for size, except those that draw, decode and recognize
# pages, which stay optimized for speed (the APK's native library is most of its download).
[profile.release.package."*"]
opt-level = "s"

[profile.release.package.hayro]
opt-level = 3
[profile.release.package.hayro-interpret]
opt-level = 3
[profile.release.package.hayro-syntax]
opt-level = 3
[profile.release.package.hayro-jbig2]
opt-level = 3
[profile.release.package.hayro-ccitt]
opt-level = 3
[profile.release.package.vello_cpu]
opt-level = 3
[profile.release.package.vello_common]
opt-level = 3
[profile.release.package.pdfcraft-render]
opt-level = 3
[profile.release.package.pdfcraft-filters]
opt-level = 3
[profile.release.package.zlib-rs]
opt-level = 3
[profile.release.package.zune-jpeg]
opt-level = 3
[profile.release.package.rten]
opt-level = 3
[profile.release.package.rten-vecmath]
opt-level = 3
[profile.release.package.rten-simd]
opt-level = 3
[profile.release.package.ocrs]
opt-level = 3
[profile.release.package.epaint]
opt-level = 3

# --- mirrored from upstream/Cargo.toml (`[patch.crates-io]`) ---
[patch.crates-io]
hayro-interpret = { path = "upstream/vendor/hayro-interpret" }
hayro = { path = "upstream/vendor/hayro" }
hayro-syntax = { path = "upstream/vendor/hayro-syntax" }
hayro-cmap = { path = "upstream/vendor/hayro-cmap" }
hayro-postscript = { path = "upstream/vendor/hayro-postscript" }
hayro-jbig2 = { path = "upstream/vendor/hayro-jbig2" }
